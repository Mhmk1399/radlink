services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  auto-assign-pages-cron:
    image: alpine:3.20
    env_file:
      - .env
    environment:
      APP_INTERNAL_URL: http://app:3000
      AUTO_PAGE_ASSIGNMENT_CRON_SCHEDULE: "0 0 * * *"
    volumes:
      - ./services/cron:/cron:ro
    command: ["/bin/sh", "/cron/auto-assign-pages-cron.sh"]
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-secret}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
