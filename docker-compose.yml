services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LIARA_BUCKET_NAME: ${NEXT_PUBLIC_LIARA_BUCKET_NAME}
        NEXT_PUBLIC_LIARA_PUBLIC_URL: ${NEXT_PUBLIC_LIARA_PUBLIC_URL}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  auto-assign-pages-cron:
    image: alpine:3.20
    env_file:
      - .env
    environment:
      APP_INTERNAL_URL: http://app:3000
      AUTO_PAGE_ASSIGNMENT_CRON_SCHEDULE: "0 0 * * *"
      USER_BULK_UPDATE_CRON_SCHEDULE: "* * * * *"
    volumes:
      - ./services/cron:/cron:ro
    command: ["/bin/sh", "/cron/auto-assign-pages-cron.sh"]
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
